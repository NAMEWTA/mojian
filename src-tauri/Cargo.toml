[package]
name = "mojian"
version = "0.0.3"
description = "Mojian: archive-first desktop notes"
authors = ["NAMEWTA"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mojian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
