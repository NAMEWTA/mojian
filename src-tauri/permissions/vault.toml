[[permission]]
identifier = "vault"
description = "Read and write the Mojian vault file and assets"
commands.allow = [
  "pick_directory",
  "get_data_dir",
  "read_data",
  "write_data",
  "write_asset",
  "read_asset",
  "get_backup_dir",
  "pick_backup_dir",
  "write_backup",
  "list_backups",
  "read_backup",
  "delete_backup",
]
