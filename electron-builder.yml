appId: app.mojian.desktop
productName: 墨笺
copyright: Copyright © 墨笺
asar: true
directories:
  output: release
  buildResources: desktop/resources
files:
  - desktop/**/*
  - package.json
extraResources:
  - from: .output
    to: server
    filter:
      - "**/*"
win:
  icon: desktop/resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-windows-x64.${ext}
mac:
  icon: desktop/resources/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-arm64.${ext}
  identity: null
  hardenedRuntime: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 墨笺
electronVersion: "37.2.0"
